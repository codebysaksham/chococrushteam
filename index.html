<title>Chococrush | Handmade Chocolate</title>
<meta name="description" content="Chococrush: authentic and delicious handmade chocolate. Order on WhatsApp or follow us on Instagram.">
<meta name="theme-color" content="#F8EADC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F8EADC;
    --cream-deep: #F0DCC8;
    --cocoa: #4A2812;
    --brown: #84512E;
    --caramel: #D3A56E;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--cream);
    color: var(--cocoa);
    font-family: var(--sans);
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  .frame {
    width: 100%;
    max-width: 480px;
    border: 1.5px solid var(--brown);
    padding: 6px;
  }
  .inner {
    border: 1px solid var(--caramel);
    padding: 32px 22px 28px;
    text-align: center;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .mark { width: 62px; height: auto; display: block; }

  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(2.7rem, 13.5vw, 3.7rem);
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--brown);
    margin-top: 16px;
  }
  .sub {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 1.35rem;
    color: var(--cocoa);
    margin-top: 6px;
  }

  .art {
    width: 100%;
    height: auto;
    display: block;
    margin: 22px 0 8px;
  }

  .lead {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.4rem;
    line-height: 1.35;
    max-width: 22ch;
    margin: 10px auto 26px;
  }

  .actions { width: 100%; display: grid; gap: 12px; }
  .btn {
    display: block;
    text-decoration: none;
    padding: 17px 16px 16px;
    border: 1.5px solid var(--brown);
    -webkit-tap-highlight-color: transparent;
    transition: background-color .15s ease, color .15s ease, transform .1s ease;
  }
  .btn small {
    display: block;
    font-size: .78rem;
    font-weight: 500;
    letter-spacing: .06em;
    margin-bottom: 4px;
  }
  .btn strong {
    display: block;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.75rem;
    line-height: 1.1;
    letter-spacing: .01em;
  }
  .btn.primary { background: var(--brown); color: var(--cream); }
  .btn.primary small { color: var(--caramel); }
  .btn.secondary { background: transparent; color: var(--brown); }
  .btn.secondary small { color: var(--cocoa); }
  .btn:active { transform: scale(.985); }
  .btn.primary:hover { background: var(--cocoa); border-color: var(--cocoa); }
  .btn.secondary:hover { background: var(--cream-deep); }
  .btn:focus-visible { outline: 3px solid var(--cocoa); outline-offset: 3px; }

  .foot {
    margin-top: 28px;
    padding-top: 20px;
    width: 100%;
    border-top: 1px solid var(--caramel);
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 1.1rem;
    color: var(--brown);
  }

  @media (min-width: 520px) {
    body { align-items: center; padding: 32px; }
    .inner { padding: 44px 36px 36px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .art { animation: settle .9s ease-out both; }
    @keyframes settle { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>
